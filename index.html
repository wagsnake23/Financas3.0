<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" as="style" />
    <script>
      (() => {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Controle Financeiro Pessoal</title>
    <meta
      name="description"
      content="Sistema completo de controle financeiro pessoal. Gerencie suas receitas, despesas e visualize relatórios detalhados."
    />
    <meta name="author" content="Controle Financeiro" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- PWA and Favicon Configuration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F9FC" />
    <!-- End PWA and Favicon Configuration -->

    <!-- Font Preload -->
    <!-- Removido: <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcC73FwrK3iLTeHuS_fvQtMwCp5RaEe_vgeO.woff2" as="font" type="font/woff2" crossorigin> -->
    <!-- Removido: <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcC73FwrK3iLTeHuS_fvQtMwCp5RaEe_vgeO.woff2" as="font" type="font/woff2" crossorigin> -->
    <!-- End Font Preload -->

    <meta property="og:title" content="Controle Financeiro Pessoal" />
    <meta property="og:description" content="Sistema completo de controle financeiro pessoal." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://financas.bombeirosagudos.com/" />

    <meta property="og:image" content="https://financas.bombeirosagudos.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://financas.bombeirosagudos.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://financas.bombeirosagudos.com/og-image.png" />
    <!-- Temporarily relaxing CSP for emoji-picker-react. Consider server-side CSP for production. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-eval'; object-src 'none'; base-uri 'self';"
    />
  </head>

  <body>
    <!-- Splash Screen institucional — HTML/CSS puro para exibição instantânea antes do React -->
    <div id="splash-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#F1F6FF;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.35s ease-out;will-change:opacity;">
      <img src="/icons/logo.png" alt="" width="80" height="80" style="margin-bottom:18px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,0.08);" />
      <div style="font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:800;font-size:22px;color:#0F172A;letter-spacing:0.3px;line-height:1;">Minhas Finanças</div>
      <div style="font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:400;font-size:13px;color:#64748B;margin-top:6px;">Controle Financeiro</div>
      <div class="splash-spinner" style="margin-top:36px;"></div>
      <style>
        .splash-spinner{width:26px;height:26px;border:3px solid #E2E8F0;border-top-color:#0556C3;border-radius:50%;animation:splash-spin .8s linear infinite}
        @keyframes splash-spin{to{transform:rotate(360deg)}}
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
